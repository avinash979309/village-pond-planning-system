# Nginx Load Balancer config for Village Pond Planning System
# Deployed on sys1 (10.1.75.53 SSH port 2205)
# Listens on port 5100 → external 10.1.75.53:5305
#
# Usage on sys1:
#   sudo cp nginx_lb.conf /etc/nginx/sites-available/pond_lb
#   sudo ln -sf /etc/nginx/sites-available/pond_lb /etc/nginx/sites-enabled/pond_lb
#   sudo nginx -t && sudo systemctl reload nginx

upstream pond_backends {
    # sys1 — primary, local (weight 1 = same as others, round-robin)
    server 127.0.0.1:5000;
    # sys2 — replica
    server 10.1.75.53:5206;
    # sys3 — replica
    server 10.1.75.53:5207;
    # sys4 — replica
    server 10.1.75.53:5208;

    keepalive 16;
}

server {
    listen 5100;
    server_name _;

    # Long timeout — analyzeArea can take 60-120s on first run
    proxy_read_timeout 180s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;

    # Pass real client IP to backend (health endpoint logs it)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Let backends know which machine they're behind
    proxy_set_header X-Via-LB          "sys1-5100";

    # Large body for KML uploads (up to 50MB)
    client_max_body_size 50M;

    location / {
        proxy_pass http://pond_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
